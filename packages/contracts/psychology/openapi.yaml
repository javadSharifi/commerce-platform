      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonItem'
    put:
      tags:
        - Admin Courses
      summary: Update lesson
      operationId: updateAdminCourseLesson
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonItem'
    delete:
      tags:
        - Admin Courses
      summary: Delete lesson
      operationId: deleteAdminCourseLesson
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lesson deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/courses/{id}/entitlements:
    get:
      tags:
        - Admin Courses
      summary: List buyer entitlements for a course
      operationId: listAdminCourseEntitlements
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of course entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseEntitlementItem'

  # ----------------------------------------------------
  # ADMIN REPORTS & ANALYTICS (Phase 4 - PSY-4.1)
  # ----------------------------------------------------
  /admin/reports/metrics:
    get:
      tags:
        - Admin Reports
      summary: Get non-PII aggregated tenant metrics
      description: Returns aggregate statistics for workshops, appointments, courses, financial revenue and media usage with zero PII.
      operationId: getAdminReportsMetrics
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Aggregated metrics report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMetricsReport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Only clinic owner role allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Server-side session token cookie for panel admins
    BuyerAuth:
      type: apiKey
      in: cookie
      name: buyer_session
      description: Server-side session cookie for buyers/clients

  schemas:
    # ---------------- Error & Common ----------------
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "نشست نامعتبر یا منقضی شده است."
        details:
          type: object
          additionalProperties: true

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "عملیات با موفقیت انجام شد."

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        total_pages:
          type: integer
          example: 3

    # ---------------- Public Site ----------------
    PublicSiteResponse:
      type: object
      required:
        - name
        - title
        - description
        - primary_color
      properties:
        name:
          type: string
          example: "کلینیک روان‌شناسی مهر"
        title:
          type: string
          example: "دکتر مریم علوی - روان‌درمانگر و مشاور خانواده"
        description:
          type: string
          example: "مرکز مشاوره و خدمات روان‌شناختی مهر"
        phone:
          type: string
          example: "02188888888"
        address:
          type: string
          example: "تهران، خیابان ولیعصر"
        primary_color:
          type: string
          example: "#0284c7"
        logo_url:
          type: string
          nullable: true
          example: "https://storage.iran.liara.space/media/logo.png"

    # ---------------- Admin Auth ----------------
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "doctor@example.com"
        password:
          type: string
          format: password
          example: "StrongPassword123"

    AuthSessionResponse:
      type: object
      required:
        - user
        - token
      properties:
        token:
          type: string
          example: "sess_6a7f8e9d0c..."
        user:
          $ref: '#/components/schemas/PanelUser'

    PanelUser:
      type: object
      required:
        - id
        - email
        - full_name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string

    Membership:
      type: object
      required:
        - tenant_id
        - tenant_name
        - tenant_slug
        - role
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_slug:
          type: string
        role:
          type: string
          enum: [owner, content_manager, receptionist, therapist]

    AdminMeResponse:
      type: object
      required:
        - user
        - memberships
      properties:
        user:
          $ref: '#/components/schemas/PanelUser'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'

    # ---------------- Admin Site Settings ----------------
    SiteSettingsResponse:
      type: object
      required:
        - tenant_id
        - title
        - description
        - phone
        - address
        - primary_color
      properties:
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        phone:
          type: string
        address:
          type: string
        primary_color:
          type: string
        logo_media_id:
          type: string
          format: uuid
