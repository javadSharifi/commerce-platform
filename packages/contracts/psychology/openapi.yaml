openapi: 3.0.3
info:
  title: Psychology Platform API
  description: Multi-tenant API for psychologists, therapists, and clinic site builder.
  version: 1.0.0
servers:
  - url: /v1
    description: V1 Base Path

paths:
  # ----------------------------------------------------
  # PUBLIC ENDPOINTS (Resolved by Host / Domain)
  # ----------------------------------------------------
  /public/site:
    get:
      tags:
        - Public
      summary: Get public site profile and settings
      description: Returns public information of the clinic resolved from request Host.
      operationId: getPublicSite
      responses:
        '200':
          description: Public site profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSiteResponse'
        '404':
          description: Clinic or domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # PUBLIC WORKSHOPS
  # ----------------------------------------------------
  /public/workshops:
    get:
      tags:
        - Public Workshops
      summary: List published workshops
      description: Returns active published workshops for the current clinic domain with remaining capacity.
      operationId: getPublicWorkshops
      responses:
        '200':
          description: List of published workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicWorkshopItem'

  /public/workshops/{id}:
    get:
      tags:
        - Public Workshops
      summary: Get published workshop details
      description: Returns details of a single published workshop.
      operationId: getPublicWorkshopDetail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workshop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorkshopDetail'
        '404':
          description: Workshop not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/workshops/{id}/register:
    post:
      tags:
        - Public Workshops
      summary: Register guest participant for workshop
      description: Registers a guest participant. For free workshops, instantly confirms. For paid workshops, reserves seat for 15 minutes (TTL) and generates payment gateway URL.
      operationId: registerPublicWorkshop
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWorkshopRequest'
      responses:
        '201':
          description: Registration initiated or confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterWorkshopResponse'
        '400':
          description: Validation error or registration deadline passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workshop not found or not published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Capacity full or phone already has active registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/workshops/registrations/{id}:
    get:
      tags:
        - Public Workshops
      summary: Check guest registration status
      description: Returns current status of guest registration using a secret lookup token.
      operationId: getPublicRegistrationStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: lookup_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # PUBLIC BLOG
  # ----------------------------------------------------
  /public/blog:
    get:
      tags:
        - Public Blog
      summary: List published blog articles
      description: Returns paginated list of published blog posts for the current clinic.
      operationId: getPublicBlogPosts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of published blog articles
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicBlogPostItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /public/blog/{slug}:
    get:
      tags:
        - Public Blog
      summary: Get published blog article by slug
      description: Returns details and structured content blocks of a published article.
      operationId: getPublicBlogPostBySlug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBlogPostDetail'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # PUBLIC MEDIA STREAMING
  # ----------------------------------------------------
  /public/media/{id}/stream-url:
    get:
      tags:
        - Public Media
      summary: Get short-lived stream URL for verified public media
      description: Returns a short-lived presigned URL (TTL 5 minutes) for streaming audio/video attached to published content.
      operationId: getPublicMediaStreamUrl
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Streaming URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamUrlResponse'
        '403':
          description: Media is not verified or not public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # ADMIN AUTH ENDPOINTS
  # ----------------------------------------------------
  /admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: Panel login
      description: Authenticates a panel user (owner, therapist, receptionist) with email and password.
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "session_token=abc123xyz; Path=/; HttpOnly; Secure; SameSite=Lax"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/auth/logout:
    post:
      tags:
        - Admin Auth
      summary: Panel logout
      description: Terminates the current active panel session.
      operationId: logoutAdmin
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/auth/me:
    get:
      tags:
        - Admin Auth
      summary: Current panel identity and memberships
      description: Returns the authenticated user's profile and clinic memberships.
      operationId: getAdminMe
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Current user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          description: Unauthorized session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # ADMIN CLINIC / SITE SETTINGS
  # ----------------------------------------------------
  /admin/site:
    get:
      tags:
        - Admin Site
      summary: Get clinic settings
      description: Returns clinic settings for the authenticated tenant.
      operationId: getAdminSite
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Clinic settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettingsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Admin Site
      summary: Update clinic settings
      description: Updates clinic title, description, contact details and visual settings.
      operationId: updateAdminSite
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteSettingsRequest'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettingsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # ADMIN WORKSHOPS
  # ----------------------------------------------------
  /admin/workshops:
    get:
      tags:
        - Admin Workshops
      summary: List workshops for clinic
      description: Returns all workshops with optional status filter for panel members.
      operationId: getAdminWorkshops
      security:
        - SessionAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, published, closed, cancelled]
      responses:
        '200':
          description: List of workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminWorkshopItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Admin Workshops
      summary: Create workshop draft
      description: Creates a new workshop in draft status. Requires owner or content_manager role.
      operationId: createAdminWorkshop
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkshopRequest'
      responses:
        '201':
          description: Workshop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkshopDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/workshops/{id}:
    get:
      tags:
        - Admin Workshops
      summary: Get workshop detail
      description: Returns complete details of a workshop.
      operationId: getAdminWorkshopDetail
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workshop detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkshopDetail'
        '404':
          description: Workshop not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Admin Workshops
      summary: Update workshop
      description: Updates workshop details. Changing price or dates is blocked if confirmed registrations exist.
      operationId: updateAdminWorkshop
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkshopRequest'
      responses:
        '200':
          description: Workshop updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkshopDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot modify price or schedule after registrations exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/workshops/{id}/publish:
    post:
      tags:
        - Admin Workshops
      summary: Publish workshop
      description: Transitions workshop from draft to published.
      operationId: publishAdminWorkshop
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workshop published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkshopDetail'

  /admin/workshops/{id}/close:
    post:
      tags:
        - Admin Workshops
      summary: Close registrations
      description: Closes registration for new attendees. Existing valid holds can still pay.
      operationId: closeAdminWorkshop
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workshop closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkshopDetail'

  /admin/workshops/{id}/cancel:
    post:
      tags:
        - Admin Workshops
      summary: Cancel workshop
      description: Cancels the entire workshop, releases seats and marks paid attendees for refund.
      operationId: cancelAdminWorkshop
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workshop cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkshopDetail'

  /admin/workshops/{id}/registrations:
    get:
      tags:
        - Admin Workshops
      summary: List registrations for workshop
      description: Returns attendees for receptionist and owner.
      operationId: getAdminWorkshopRegistrations
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Attendee registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRegistrationItem'

  /admin/workshops/{id}/registrations/{reg_id}/cancel:
    post:
      tags:
        - Admin Workshops
      summary: Cancel registration
      description: Records guest cancellation by receptionist or owner.
      operationId: cancelAdminRegistration
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: reg_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Registration cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ----------------------------------------------------
  # ADMIN PAYMENTS & REFUNDS
  # ----------------------------------------------------
  /admin/payments:
    get:
      tags:
        - Admin Payments
      summary: List purchases and payments
      description: Financial log for owner role.
      operationId: getAdminPayments
      security:
        - SessionAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed, refund_required, refunded, failed]
      responses:
        '200':
          description: Purchases and payments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPurchaseItem'
        '403':
          description: Forbidden - Owner role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/payments/{purchase_id}/refund:
    post:
      tags:
        - Admin Payments
      summary: Record manual refund
      description: Records reference number and details of manual refund performed by clinic owner.
      operationId: recordAdminRefund
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRefundRequest'
      responses:
        '200':
          description: Refund recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '403':
          description: Forbidden - Owner role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # ADMIN BLOG
  # ----------------------------------------------------
  /admin/blog:
    get:
      tags:
        - Admin Blog
      summary: List blog posts
      description: Returns all posts (drafts and published) for content managers and owners.
      operationId: getAdminBlogPosts
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Blog post items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminBlogPostItem'
    post:
      tags:
        - Admin Blog
      summary: Create blog post
      description: Creates a new post in draft status.
      operationId: createAdminBlogPost
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlogPostRequest'
      responses:
        '201':
          description: Blog post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlogPostDetail'

  /admin/blog/{id}:
    get:
      tags:
        - Admin Blog
      summary: Get blog post for editor
      description: Returns full structured blog content for editing.
      operationId: getAdminBlogPostDetail
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Blog post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlogPostDetail'
    put:
      tags:
        - Admin Blog
      summary: Update blog post
      description: Updates blog title, slug, seo description and content blocks.
      operationId: updateAdminBlogPost
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlogPostRequest'
      responses:
        '200':
          description: Blog post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlogPostDetail'
    delete:
      tags:
        - Admin Blog
      summary: Delete blog post
      description: Deletes a blog post draft or published post.
      operationId: deleteAdminBlogPost
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Blog post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/blog/{id}/publish:
    post:
      tags:
        - Admin Blog
      summary: Publish blog post
      description: Transitions blog post from draft to published and sets published_at timestamp.
      operationId: publishAdminBlogPost
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Blog post published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlogPostDetail'

  /admin/blog/{id}/unpublish:
    post:
      tags:
        - Admin Blog
      summary: Unpublish blog post
      description: Returns published blog post back to draft.
      operationId: unpublishAdminBlogPost
      security:
        - SessionAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Blog post unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlogPostDetail'

  # ----------------------------------------------------
  # ADMIN MEDIA UPLOADS & MANAGEMENT
  # ----------------------------------------------------
  /admin/media/upload-url:
    post:
      tags:
        - Admin Media
      summary: Request presigned staging upload URL
      description: Checks storage quota (10 GiB max) and issues a short-lived presigned upload URL (TTL 15 min) for direct upload to S3 staging.
      operationId: requestMediaUploadUrl
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMediaUploadRequest'
      responses:
        '201':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestMediaUploadResponse'
        '403':
          description: Storage quota exceeded (10 GiB limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/media/finalize:
    post:
      tags:
        - Admin Media
      summary: Finalize uploaded media
      description: Notifies backend to move file from staging to final key, validate actual size and MIME type, and create media asset record.
      operationId: finalizeMediaUpload
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeMediaUploadRequest'
      responses:
        '200':
          description: Media asset registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'

  /admin/media:
    get:
      tags:
        - Admin Media
      summary: List clinic media assets
      description: Returns media assets and overall storage quota usage.
      operationId: getAdminMediaList
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Media assets and quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'

  # ----------------------------------------------------
  # ACCOUNT ENDPOINTS (Phase 3 Placeholder)
  # ----------------------------------------------------
  /account/profile:
    get:
      tags:
        - Account
      summary: Client / Buyer profile
      description: Client profile scoped to the tenant (Phase 3).
      operationId: getAccountProfile
      security:
        - BuyerAuth: []
      responses:
        '200':
          description: Buyer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # CALLBACK ENDPOINTS (Phase 1 Placeholder)
  # ----------------------------------------------------
  /callbacks/payments/zarinpal:
    get:
      tags:
        - Callbacks
      summary: ZarinPal payment gateway return callback
      description: Public return endpoint called by payment gateway after customer transaction.
      operationId: handleZarinpalCallback
      parameters:
        - in: query
          name: Authority
          schema:
            type: string
          required: true
        - in: query
          name: Status
          schema:
            type: string
          required: true
      responses:
        '302':
          description: Redirects to receipt or payment status page on the tenant storefront

  # ----------------------------------------------------
  # PUBLIC BOOKINGS & THERAPISTS (Phase 2 - PSY-2.1)
  # ----------------------------------------------------
  /public/therapists:
    get:
      tags:
        - Public Therapists
      summary: List active therapists
      description: Returns active therapists of the clinic with public profile and specializations.
      operationId: getPublicTherapists
      responses:
        '200':
          description: List of active therapists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicTherapistItem'

  /public/therapists/{id}:
    get:
      tags:
        - Public Therapists
      summary: Get therapist details
      description: Returns public details and bio of a specific therapist.
      operationId: getPublicTherapistDetail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Therapist profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTherapistDetail'
        '404':
          description: Therapist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/therapists/{id}/slots:
    get:
      tags:
        - Public Therapists
      summary: Get available future appointment slots
      description: Returns available time slots for the therapist within the next 30 days without exposing any PII.
      operationId: getPublicTherapistSlots
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: from_date
          schema:
            type: string
            format: date
          description: Optional start date filter (defaults to today)
      responses:
        '200':
          description: List of available appointment slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicAppointmentSlot'

  /public/appointments:
    post:
      tags:
        - Public Appointments
      summary: Request an appointment booking
      description: Initiates a booking for an available time slot with a 2-hour pending TTL. Holds the slot atomically.
      operationId: createPublicAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment requested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointmentResponse'
        '400':
          description: Invalid input or slot in the past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slot is no longer available (already booked or reserved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/appointments/{id}:
    get:
      tags:
        - Public Appointments
      summary: Check appointment booking status
      description: Returns booking status for the initiator using guest lookup hash.
      operationId: getPublicAppointmentStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Guest-Lookup-Hash
          schema:
            type: string
          required: true
          description: Secure lookup hash returned upon appointment creation
      responses:
        '200':
          description: Appointment status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointmentResponse'
        '404':
          description: Appointment not found or unauthorized hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/appointments/{id}/cancel:
    post:
      tags:
        - Public Appointments
      summary: Cancel appointment by guest
      description: Cancels pending or confirmed appointment before session start time.
      operationId: cancelPublicAppointment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Guest-Lookup-Hash
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
      responses:
        '200':
          description: Appointment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointmentResponse'
        '400':
          description: Cannot cancel appointment (already completed or session started)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

