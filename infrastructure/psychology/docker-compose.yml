# infrastructure/psychology/docker-compose.yml
# Production & Pilot Stack for Multi-Tenant Psychology Platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: psychology-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psychology_prod}
      POSTGRES_USER: ${POSTGRES_USER:-psychology_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-secret_admin_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - psychology_pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psychology_admin} -d ${POSTGRES_DB:-psychology_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - psychology_net

  api:
    build:
      context: ../../apps/psychology-api
      dockerfile: Dockerfile
    container_name: psychology-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://app_user:${DB_APP_PASSWORD:-secret_app_pass}@postgres:5432/${POSTGRES_DB:-psychology_prod}?sslmode=disable}
      PARSPACK_S3_ENDPOINT: ${PARSPACK_S3_ENDPOINT}
      PARSPACK_S3_BUCKET: ${PARSPACK_S3_BUCKET}
      PARSPACK_REGION: ${PARSPACK_REGION:-ir-tbz-sh1}
      PARSPACK_ACCESS_KEY: ${PARSPACK_ACCESS_KEY}
      PARSPACK_SECRET_KEY: ${PARSPACK_SECRET_KEY}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
      SESSION_SECRET: ${SESSION_SECRET:-pilot_random_session_secret_key_123456}
      ENV: ${ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psychology_net

  admin:
    build:
      context: ../..
      dockerfile: apps/psychology-admin/Dockerfile
    container_name: psychology-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4321"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    depends_on:
      - api
    networks:
      - psychology_net

  site:
    build:
      context: ../..
      dockerfile: apps/psychology-site/Dockerfile
    container_name: psychology-site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4322"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    depends_on:
      - api
    networks:
      - psychology_net

  caddy:
    image: caddy:2.8-alpine
    container_name: psychology-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SSL_EMAIL: ${SSL_EMAIL:-admin@psychology.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - site
    networks:
      - psychology_net

  backup:
    image: postgres:16-alpine
    container_name: psychology-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-psychology_prod}
      POSTGRES_USER: ${POSTGRES_USER:-psychology_admin}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-secret_admin_pass}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do /bin/sh /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psychology_net

volumes:
  psychology_pg_data:
  caddy_data:
  caddy_config:

networks:
  psychology_net:
    driver: bridge
