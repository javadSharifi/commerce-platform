version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/domain/queries.sql"
    gen:
      go:
        package: "domaindb"
        out: "internal/domain/domaindb"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/auth/queries.sql"
    gen:
      go:
        package: "authdb"
        out: "internal/auth/authdb"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/settings/queries.sql"
    gen:
      go:
        package: "settingsdb"
        out: "internal/settings/settingsdb"
        sql_package: "pgx/v5"
